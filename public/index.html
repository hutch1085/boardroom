<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Boardroom — Crypto Scanner HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0e14;
  --surface: #141820;
  --surface2: #1a1f2e;
  --border: #2a3040;
  --text: #e2e8f0;
  --text-dim: #8892a4;
  --accent: #6366f1;
  --green: #22c55e;
  --red: #ef4444;
  --orange: #FF9F43;
  --blue: #3b82f6;
  --pink: #E91E63;
  --purple: #7C4DFF;
  --dawn: #FF9F43;
  --noon: #3b82f6;
  --close: #E91E63;
  --night: #7C4DFF;
}

html { font-size: 16px; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* === HEADER === */
.header {
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(11,14,20,0.85);
  backdrop-filter: blur(10px);
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 200;
  border-bottom: 1px solid rgba(42,48,64,0.5);
}
.header-title {
  font-size: 1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.header-title span { color: var(--accent); }
.header-meta {
  font-size: 0.7rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}

/* === BOARDROOM SCENE (full viewport) === */
.boardroom {
  position: relative;
  width: 100%;
  height: 100vh;
  min-height: 500px;
  overflow: hidden;
}
.boardroom img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.boardroom-dim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.3) 60%, rgba(11,14,20,0.95) 92%, var(--bg) 100%);
  pointer-events: none;
}

/* === OVERLAY BOARDS === */
.screen-overlay {
  position: absolute;
  background: rgba(11,14,20,0.85);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(99,102,241,0.3);
  border-radius: 6px;
  overflow: hidden;
  z-index: 10;
}
.screen-overlay .screen-title {
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  padding: 6px 10px;
  border-bottom: 1px solid rgba(42,48,64,0.5);
}
.screen-title.holdings { color: var(--green); }
.screen-title.aggregate { color: var(--accent); }

/* LEFT SCREEN — Positions */
.screen-holdings {
  top: 8%;
  left: 2%;
  width: 33%;
  max-height: 42%;
}
/* RIGHT SCREEN — Aggregate */
.screen-aggregate {
  top: 8%;
  right: 2%;
  width: 33%;
  max-height: 42%;
}

.screen-body {
  padding: 4px 6px;
  overflow-y: auto;
  max-height: calc(100% - 28px);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.6rem;
}
.screen-body::-webkit-scrollbar { width: 3px; }
.screen-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Holdings summary bar */
.screen-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 12px;
  padding: 4px 6px;
  background: rgba(26,31,46,0.7);
  font-size: 0.58rem;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-dim);
  border-bottom: 1px solid rgba(42,48,64,0.4);
}
.screen-summary strong { color: var(--text); }
.screen-summary .s-up strong { color: var(--green); }
.screen-summary .s-down strong { color: var(--red); }

/* Mini holding row */
.h-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 4px;
  border-bottom: 1px solid rgba(42,48,64,0.3);
}
.h-row:last-child { border-bottom: none; }
.h-sym { font-weight: 700; color: var(--text); font-size: 0.62rem; min-width: 36px; }
.h-val { color: var(--text-dim); font-size: 0.55rem; }
.h-pnl { font-weight: 600; font-size: 0.58rem; }
.h-pnl.up { color: var(--green); }
.h-pnl.down { color: var(--red); }
.h-pnl.loading { color: var(--text-dim); }

/* === AGGREGATE P&L PANEL === */
.agg-big {
  padding: 8px 10px;
  text-align: center;
  border-bottom: 1px solid rgba(42,48,64,0.4);
}
.agg-label {
  font-size: 0.5rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-dim);
  margin-bottom: 2px;
}
.agg-value {
  font-size: 1.1rem;
  font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
}
.agg-sub {
  font-size: 0.55rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}
.agg-row {
  display: flex;
  justify-content: space-around;
  padding: 4px 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.52rem;
  color: var(--text-dim);
  border-bottom: 1px solid rgba(42,48,64,0.3);
}
.agg-row strong { color: var(--text); }

/* 4-week chart */
.history-chart-area {
  padding: 4px 6px 2px;
}
.history-chart-area canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.chart-label {
  font-size: 0.45rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
  padding: 0 0 3px;
}

/* === AGENT NAMEPLATES === */
.nameplate {
  position: absolute;
  z-index: 20;
  background: rgba(11,14,20,0.85);
  backdrop-filter: blur(8px);
  border-radius: 6px;
  padding: 4px 12px;
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border: 1px solid;
  white-space: nowrap;
  text-align: center;
}
.nameplate.dawn  { bottom: 32%; left: 10%;  color: var(--dawn);  border-color: rgba(255,159,67,0.5); transform: translateX(-50%); }
.nameplate.noon  { bottom: 32%; left: 35%;  color: var(--noon);  border-color: rgba(59,130,246,0.5);  transform: translateX(-50%); }
.nameplate.close { bottom: 32%; left: 63%;  color: var(--close); border-color: rgba(233,30,99,0.5);   transform: translateX(-50%); }
.nameplate.night { bottom: 32%; left: 88%;  color: var(--night); border-color: rgba(124,77,255,0.5);  transform: translateX(-50%); }
.nameplate .plate-time {
  font-size: 0.48rem;
  font-weight: 500;
  color: var(--text-dim);
  display: block;
  letter-spacing: 0.04em;
}

/* === SPEECH BUBBLES === */
.agent-bubbles {
  position: absolute;
  bottom: 38%;
  left: 2%;
  right: 2%;
  display: flex;
  justify-content: space-around;
  gap: 6px;
  z-index: 15;
  pointer-events: none;
}
.speech-bubble {
  background: rgba(20, 24, 32, 0.92);
  backdrop-filter: blur(12px);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 0.72rem;
  line-height: 1.4;
  max-width: 22%;
  border: 1px solid var(--border);
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 0.4s, transform 0.4s;
  display: none;
  pointer-events: auto;
}
.speech-bubble.visible {
  opacity: 1;
  transform: translateY(0);
  display: block;
}
.bubble-agent {
  font-weight: 600;
  font-size: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.bubble-agent.dawn { color: var(--dawn); }
.bubble-agent.noon { color: var(--noon); }
.bubble-agent.close { color: var(--close); }
.bubble-agent.night { color: var(--purple); }

/* === BOTTOM SECTION (Chat) === */
.bottom-section {
  position: relative;
  z-index: 50;
  background: var(--bg);
  padding: 16px 20px 20px;
  max-width: 1000px;
  margin: 0 auto;
}
.chat-container {
  background: var(--surface);
  border-radius: 14px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.chat-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}
.chat-log {
  height: 260px;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chat-log::-webkit-scrollbar { width: 4px; }
.chat-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.chat-msg {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}
.avatar-sm {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  border: 2px solid;
}
.msg-body {
  background: var(--surface2);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 0.78rem;
  line-height: 1.5;
  border: 1px solid var(--border);
  max-width: 85%;
}
.msg-name {
  font-weight: 700;
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 2px;
}
.user-msg { justify-content: flex-end; }
.user-msg .msg-body {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.chat-input-bar {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
}
.chat-input-bar input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 0.8rem;
  font-family: 'Inter', sans-serif;
  outline: none;
}
.chat-input-bar input::placeholder { color: var(--text-dim); }
.chat-input-bar input:focus { border-color: var(--accent); }
.chat-input-bar button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 18px;
  font-weight: 600;
  font-size: 0.8rem;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
}
.chat-input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

.footer {
  text-align: center;
  padding: 16px;
  font-size: 0.65rem;
  color: var(--text-dim);
}

/* === TYPING CURSOR === */
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: var(--accent);
  animation: blink 0.8s infinite;
  vertical-align: text-bottom;
  margin-left: 1px;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* === RESPONSIVE === */
@media (max-width: 768px) {
  .boardroom { height: 70vh; min-height: 400px; }
  .screen-holdings, .screen-aggregate {
    width: 46%;
    max-height: 40%;
  }
  .screen-holdings { left: 1%; top: 7%; }
  .screen-aggregate { right: 1%; top: 7%; }
  .screen-body { font-size: 0.52rem; }
  .screen-summary { font-size: 0.5rem; gap: 4px 8px; }
  .h-sym { font-size: 0.55rem; }
  .agg-value { font-size: 0.9rem; }
  .agg-label { font-size: 0.45rem; }
  .nameplate { font-size: 0.55rem; padding: 3px 8px; }
  .nameplate .plate-time { font-size: 0.4rem; }
  .speech-bubble { max-width: 30%; font-size: 0.62rem; padding: 6px 8px; }
  .agent-bubbles { bottom: 35%; }
  .chat-log { height: 200px; }
  .bottom-section { padding: 12px; }
}

@media (max-width: 480px) {
  html { font-size: 14px; }
  .boardroom { height: 55vh; min-height: 320px; }
  .screen-holdings, .screen-aggregate {
    width: 48%;
    max-height: 38%;
  }
  .screen-body { font-size: 0.48rem; padding: 2px 4px; }
  .screen-summary { font-size: 0.46rem; padding: 3px 4px; }
  .screen-overlay .screen-title { font-size: 0.5rem; padding: 4px 6px; }
  .h-row { padding: 2px 3px; }
  .agg-value { font-size: 0.75rem; }
  .agg-sub { font-size: 0.48rem; }
  .agg-row { font-size: 0.46rem; }
  .nameplate { font-size: 0.48rem; padding: 2px 6px; bottom: 28%; }
  .nameplate .plate-time { display: none; }
  .speech-bubble { max-width: 40%; font-size: 0.56rem; }
  .agent-bubbles { bottom: 32%; flex-wrap: wrap; justify-content: center; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-title"><span>THE</span> BOARDROOM</div>
  <div class="header-meta" id="lastUpdated">Loading...</div>
</header>

<!-- FULL-SCREEN BOARDROOM SCENE -->
<section class="boardroom">
  <img src="boardroom-hero.jpg" alt="Four AI trading agents around a boardroom table">
  <div class="boardroom-dim"></div>

  <!-- LEFT SCREEN — Individual Positions -->
  <div class="screen-overlay screen-holdings">
    <div class="screen-title holdings">Positions</div>
    <div id="holdingsSummary" class="screen-summary">
      <span>Loading prices...</span>
    </div>
    <div class="screen-body" id="holdingsRows">
      <div style="padding:8px;text-align:center;color:var(--text-dim)">&#x23F3;</div>
    </div>
  </div>

  <!-- RIGHT SCREEN — Aggregate P&L + 4-Week Chart -->
  <div class="screen-overlay screen-aggregate">
    <div class="screen-title aggregate">Portfolio</div>
    <div id="aggPanel" class="agg-big">
      <div class="agg-label">Total P&amp;L</div>
      <div class="agg-value" id="aggPnl" style="color:var(--text-dim)">Loading...</div>
      <div class="agg-sub" id="aggSub"></div>
    </div>
    <div id="aggDetails" class="agg-row"></div>
    <div class="history-chart-area" style="height:calc(100% - 110px);min-height:60px;">
      <canvas id="historyChart"></canvas>
    </div>
    <div class="chart-label" id="chartLabel">4-Week Performance</div>
  </div>

  <!-- AGENT NAMEPLATES -->
  <div class="nameplate dawn">&#x2600;&#xFE0F; Dawn<span class="plate-time">6AM HST</span></div>
  <div class="nameplate noon">&#x1F4CA; Noon<span class="plate-time">12PM HST</span></div>
  <div class="nameplate close">&#x1F6E1;&#xFE0F; Close<span class="plate-time">4PM HST</span></div>
  <div class="nameplate night">&#x1F989; Night<span class="plate-time">8PM HST</span></div>

  <!-- SPEECH BUBBLES -->
  <div class="agent-bubbles">
    <div class="speech-bubble" id="bubble-dawn">
      <div class="bubble-agent dawn">Dawn</div>
      <div class="bubble-text"></div>
    </div>
    <div class="speech-bubble" id="bubble-noon">
      <div class="bubble-agent noon">Noon</div>
      <div class="bubble-text"></div>
    </div>
    <div class="speech-bubble" id="bubble-close">
      <div class="bubble-agent close">Close</div>
      <div class="bubble-text"></div>
    </div>
    <div class="speech-bubble" id="bubble-night">
      <div class="bubble-agent night">Night</div>
      <div class="bubble-text"></div>
    </div>
  </div>
</section>

<!-- CHAT BELOW THE SCENE -->
<section class="bottom-section">
  <div class="chat-container">
    <div class="chat-header">Agent Chat</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-bar">
      <input type="text" id="userInput" placeholder="Ask the agents..."
             onkeydown="if(event.key==='Enter')sendQuestion()">
      <button id="sendBtn" onclick="sendQuestion()">Ask</button>
    </div>
  </div>
</section>

<div class="footer" id="dataTimestamp">Boardroom Scanner HQ</div>

<script>
// ============================================================
// === DEFAULT DATA (overwritten by data.json) ===
// ============================================================
let HOLDINGS = [
  { sym:'BTC', id:'btc-bitcoin', qty:0.0003886, entry:63462.80, date:'Aug 16', cost:24.66 },
  { sym:'ETH', id:'eth-ethereum', qty:0.016746, entry:1913.05, date:'Aug 18', cost:32.05 },
  { sym:'SOL', id:'sol-solana', qty:0.96289, entry:92.80, date:'Aug 16', cost:89.36 },
  { sym:'UNI', id:'uni-uniswap', qty:3.2119, entry:3.32, date:'Aug 17', cost:10.75 },
  { sym:'LINK', id:'link-chainlink', qty:30.5616, entry:11.42, date:'Aug 29', cost:349.05 },
  { sym:'AAVE', id:'aave-new', qty:1.18158, entry:125.00, date:'Aug 31', cost:147.70 },
  { sym:'ZEC', id:'zec-zcash', qty:0.06224, entry:939.05, date:'Sep 3', cost:59.00 },
  { sym:'ADA', id:'ada-cardano', qty:468.38, entry:0.2116, date:'Sep 4', cost:100.00 },
  { sym:'LTC', id:'ltc-litecoin', qty:3.84515721, entry:52.01, date:'Sep 4', cost:200.00 },
  { sym:'DOT', id:'dot-polkadot', qty:154.152, entry:0.908, date:'Sep 4', cost:140.00 },
];
let WATCHLIST = [];
let CASH = 105;
let TENSIONS = '';
let OPENING = [];

// ============================================================
// === LOAD DATA.JSON ===
// ============================================================
async function loadPortfolioData() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) return;
    const data = await r.json();
    if (data.holdings) HOLDINGS = data.holdings;
    if (data.watchlist) WATCHLIST = data.watchlist;
    if (data.cash != null) CASH = data.cash;
    if (data.tensions) TENSIONS = data.tensions;
    if (data.opening && data.opening.length) OPENING = data.opening;
    // Load prices from scan tasks (Robinhood data)
    if (data.prices && typeof data.prices === 'object') {
      priceCache = data.prices;
      pricesLoaded = Object.keys(priceCache).length > 0;
    }
    // Load history snapshots for 4-week chart
    if (data.history && Array.isArray(data.history)) {
      historyData = data.history;
    }
    if (data.lastUpdated) {
      const d = new Date(data.lastUpdated);
      document.getElementById('lastUpdated').textContent = d.toLocaleTimeString();
      const el = document.getElementById('dataTimestamp');
      if (el) el.textContent = 'Last scan: ' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
    }
  } catch(e) { console.warn('Could not load data.json', e); }
}

// ============================================================
// === STATE ===
// ============================================================
let priceCache = {};
let pricesLoaded = false;
let historyData = []; // [{date, value}]

const AGENTS = {
  dawn:  { name:'Dawn',  color:'#FF9F43', bg:'rgba(255,159,67,0.15)', icon:'☀️' },
  noon:  { name:'Noon',  color:'#3b82f6', bg:'rgba(59,130,246,0.15)', icon:'📊' },
  close: { name:'Close', color:'#E91E63', bg:'rgba(233,30,99,0.15)',  icon:'🛡️' },
  night: { name:'Night', color:'#7C4DFF', bg:'rgba(124,77,255,0.15)', icon:'🦉' },
};

// ============================================================
// === PRICES FROM DATA.JSON (no external API) ===
// ============================================================
// Prices are written by scan tasks into data.json as:
//   "prices": {"BTC": 84500.50, "ETH": 2100.30, ...}
// History snapshots written as:
//   "history": [{"date":"2026-09-05","value":1250.00,"cost":1152.57}, ...]
// loadPortfolioData() populates priceCache and historyData from these fields.

function fmt(n) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1) return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (Math.abs(n) < 0.01) return n.toFixed(6);
  return n.toFixed(4);
}
function fmtUSD(n) { return n == null || isNaN(n) ? '—' : '$' + fmt(n); }
function fmtCompact(n) {
  if (n == null || isNaN(n)) return '...';
  if (Math.abs(n) >= 1000) return '$' + (n/1000).toFixed(1) + 'k';
  if (Math.abs(n) >= 1) return '$' + n.toFixed(2);
  if (Math.abs(n) < 0.01) return '$' + n.toFixed(6);
  return '$' + n.toFixed(4);
}

// ============================================================
// === RENDER HOLDINGS (left screen — positions only) ===
// ============================================================
function renderHoldings() {
  const container = document.getElementById('holdingsRows');
  const summaryEl = document.getElementById('holdingsSummary');
  let totalValue = 0, totalCost = 0, loaded = 0;
  let html = '';

  for (const h of HOLDINGS) {
    const price = priceCache[h.sym] != null ? priceCache[h.sym] : null;
    const val = price != null ? h.qty * price : null;
    const pnlPct = price != null ? ((price - h.entry) / h.entry) * 100 : null;
    if (val != null) { totalValue += val; loaded++; }
    totalCost += h.cost;
    const isUp = pnlPct != null && pnlPct >= 0;

    html += `<div class="h-row">
      <span class="h-sym">${h.sym}</span>
      <span class="h-val">${val != null ? fmtCompact(val) : '...'}</span>
      <span class="h-pnl ${pnlPct != null ? (isUp ? 'up' : 'down') : 'loading'}">${pnlPct != null ? (isUp ? '+' : '') + pnlPct.toFixed(1) + '%' : '...'}</span>
    </div>`;
  }
  container.innerHTML = html;

  // Summary bar
  if (!pricesLoaded || loaded === 0) {
    summaryEl.innerHTML = `<span>Cost: <strong>${fmtUSD(totalCost)}</strong></span>
      <span>Cash: <strong style="color:var(--blue)">~$${CASH}</strong></span>
      <span>Prices: <strong style="color:var(--text-dim)">Loading...</strong></span>`;
  } else {
    const pnl = totalValue - totalCost;
    const pnlPct = totalCost > 0 ? (pnl / totalCost) * 100 : 0;
    const up = pnl >= 0;
    summaryEl.innerHTML = `<span>Val: <strong>${fmtCompact(totalValue)}</strong></span>
      <span>Cost: <strong>${fmtCompact(totalCost)}</strong></span>
      <span class="${up ? 's-up' : 's-down'}">P&L: <strong>${(up?'+':'')+fmtCompact(pnl)} (${(up?'+':'')+pnlPct.toFixed(1)}%)</strong></span>`;
  }
}

// ============================================================
// === RENDER AGGREGATE (right screen) ===
// ============================================================
function renderAggregate() {
  const pnlEl = document.getElementById('aggPnl');
  const subEl = document.getElementById('aggSub');
  const detailsEl = document.getElementById('aggDetails');

  let totalValue = 0, totalCost = 0, loaded = 0;
  for (const h of HOLDINGS) {
    const price = priceCache[h.sym] != null ? priceCache[h.sym] : null;
    if (price != null) { totalValue += h.qty * price; loaded++; }
    totalCost += h.cost;
  }

  if (!pricesLoaded || loaded === 0) {
    pnlEl.textContent = 'Loading...';
    pnlEl.style.color = 'var(--text-dim)';
    subEl.textContent = '';
    detailsEl.innerHTML = `<span>Cost Basis: <strong>${fmtUSD(totalCost)}</strong></span>
      <span>Cash: <strong>~$${CASH}</strong></span>`;
    return;
  }

  const pnl = totalValue - totalCost;
  const pnlPct = totalCost > 0 ? (pnl / totalCost) * 100 : 0;
  const up = pnl >= 0;

  pnlEl.textContent = (up ? '+' : '') + fmtCompact(pnl);
  pnlEl.style.color = up ? 'var(--green)' : 'var(--red)';
  subEl.textContent = (up ? '+' : '') + pnlPct.toFixed(1) + '% all-time';

  const totalEquity = totalValue + CASH;
  detailsEl.innerHTML = `<span>Value: <strong>${fmtCompact(totalValue)}</strong></span>
    <span>Cost: <strong>${fmtCompact(totalCost)}</strong></span>
    <span>Equity: <strong style="color:var(--accent)">${fmtCompact(totalEquity)}</strong></span>`;
}

// ============================================================
// === DRAW 4-WEEK HISTORY CHART ===
// ============================================================
function drawHistoryChart() {
  const canvas = document.getElementById('historyChart');
  if (!canvas || historyData.length < 2) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  const W = rect.width, H = rect.height;
  const pad = { top: 8, bottom: 14, left: 4, right: 4 };
  const plotW = W - pad.left - pad.right;
  const plotH = H - pad.top - pad.bottom;

  const totalCost = HOLDINGS.reduce((s, h) => s + h.cost, 0);
  const values = historyData.map(d => d.value);
  const minVal = Math.min(...values, totalCost) * 0.98;
  const maxVal = Math.max(...values, totalCost) * 1.02;
  const range = maxVal - minVal || 1;

  ctx.clearRect(0, 0, W, H);

  // Cost basis line (dashed)
  const costY = pad.top + plotH - ((totalCost - minVal) / range) * plotH;
  ctx.beginPath();
  ctx.setLineDash([3, 3]);
  ctx.strokeStyle = 'rgba(136,146,164,0.4)';
  ctx.lineWidth = 1;
  ctx.moveTo(pad.left, costY);
  ctx.lineTo(pad.left + plotW, costY);
  ctx.stroke();
  ctx.setLineDash([]);

  // Cost basis label
  ctx.fillStyle = 'rgba(136,146,164,0.6)';
  ctx.font = '7px "JetBrains Mono"';
  ctx.textAlign = 'right';
  ctx.fillText('cost', pad.left + plotW - 2, costY - 2);

  // Portfolio value line
  const points = historyData.map((d, i) => ({
    x: pad.left + (i / (historyData.length - 1)) * plotW,
    y: pad.top + plotH - ((d.value - minVal) / range) * plotH,
    value: d.value
  }));

  // Fill area under line
  const lastPoint = points[points.length - 1];
  const isUp = lastPoint.value >= totalCost;

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.lineTo(lastPoint.x, pad.top + plotH);
  ctx.lineTo(points[0].x, pad.top + plotH);
  ctx.closePath();
  ctx.fillStyle = isUp ? 'rgba(34,197,94,0.12)' : 'rgba(239,68,68,0.12)';
  ctx.fill();

  // Line itself
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i].x, points[i].y);
  }
  ctx.strokeStyle = isUp ? '#22c55e' : '#ef4444';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Current value dot
  ctx.beginPath();
  ctx.arc(lastPoint.x, lastPoint.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = isUp ? '#22c55e' : '#ef4444';
  ctx.fill();

  // Date labels
  ctx.fillStyle = 'rgba(136,146,164,0.5)';
  ctx.font = '6px "JetBrains Mono"';
  ctx.textAlign = 'center';
  const labelIndices = [0, Math.floor(historyData.length / 4), Math.floor(historyData.length / 2),
                        Math.floor(3 * historyData.length / 4), historyData.length - 1];
  for (const idx of labelIndices) {
    if (idx < historyData.length) {
      const d = historyData[idx].date;
      const label = d.slice(5); // MM-DD
      ctx.fillText(label, points[idx].x, H - 2);
    }
  }
}

// ============================================================
// === SYSTEM PROMPT ===
// ============================================================
function buildSystemPrompt() {
  let holdingsText = HOLDINGS.map(h => {
    const p = priceCache[h.sym];
    const cur = p != null ? '$' + p.toFixed(2) : '?';
    return `- ${h.sym} ${h.qty} @ $${h.entry} entry (now ${cur}), cost $${h.cost}`;
  }).join('\n');

  return `You are playing 4 distinct cartoon characters who are crypto trading scanner agents sitting around a boardroom table. They are debating James's portfolio and trading strategy.

THE 4 AGENTS:
1. "Dawn" (6AM HST scan) — The early bird. Enthusiastic, optimistic, always caffeinated. Uses sunrise/morning metaphors. Sees opportunity everywhere. Speaks with energy and exclamation marks.
2. "Noon" (12PM HST scan) — The analyst. Sharp, data-driven, references charts and indicators. Professional but not boring. Uses precise numbers. The most measured voice.
3. "Close" (4PM HST scan) — The risk manager. Cautious, protective of capital. Sunset/end-of-day metaphors. Worries about drawdowns and concentration risk. Maternal/paternal about the portfolio.
4. "Night" (8PM HST scan) — The contrarian owl. Nocturnal, sees what others miss. Loves going against consensus. Cryptic one-liners. Dark humor. Questions everything.

JAMES'S CURRENT PORTFOLIO (cash ~$${CASH}):
${holdingsText}

KEY TENSIONS THE AGENTS SHOULD REFERENCE:
${TENSIONS || '- Check data.json for current tensions'}

RESPONSE FORMAT:
You MUST respond in valid JSON. Pick 1-3 agents who would most naturally respond to the question. Format:
[
  {"agent": "dawn", "text": "..."},
  {"agent": "noon", "text": "..."}
]

Each agent's response should be 1-3 sentences, in their distinct voice. They can agree, disagree, or riff off each other. Keep responses punchy and character-driven. Reference specific positions and numbers when relevant.`;
}

// ===== TYPING ANIMATION =====
function typeText(element, text, speed = 25) {
  return new Promise(resolve => {
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    element.textContent = '';
    element.appendChild(cursor);
    function tick() {
      if (i < text.length) {
        cursor.before(document.createTextNode(text[i]));
        i++;
        setTimeout(tick, speed + Math.random() * 15);
      } else {
        cursor.remove();
        resolve();
      }
    }
    tick();
  });
}

// ===== OPENING DEBATE =====
async function runOpeningDebate() {
  if (!OPENING.length) return;
  for (const line of OPENING) {
    const container = document.getElementById(`bubble-${line.agent}`);
    if (!container) continue;
    const textEl = container.querySelector('.bubble-text');
    container.classList.add('visible');
    await typeText(textEl, line.text, 20);
    await new Promise(r => setTimeout(r, 1200));
  }
  await new Promise(r => setTimeout(r, 3000));
  for (const line of OPENING) {
    const el = document.getElementById(`bubble-${line.agent}`);
    if (el) el.classList.remove('visible');
    addToChatLog(line.agent, line.text);
  }
}

// ===== CHAT LOG =====
function addToChatLog(agentKey, text) {
  const log = document.getElementById('chatLog');
  const a = AGENTS[agentKey];
  if (!a) return;
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `
    <div class="avatar-sm" style="background:${a.bg};border-color:${a.color}">${a.icon}</div>
    <div class="msg-body" style="border-color:${a.color}30">
      <div class="msg-name" style="color:${a.color}">${a.name}</div>
      ${text}
    </div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function addUserMsg(text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'chat-msg user-msg';
  div.innerHTML = `<div class="msg-body"><div class="msg-name" style="color:rgba(255,255,255,0.7)">James</div>${text}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ===== SEND QUESTION =====
async function sendQuestion() {
  const input = document.getElementById('userInput');
  const btn = document.getElementById('sendBtn');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  btn.disabled = true;
  btn.textContent = '...';
  addUserMsg(q);

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: buildSystemPrompt(),
        messages: [{ role: 'user', content: q }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`API ${resp.status}: ${err.slice(0, 200)}`);
    }

    const data = await resp.json();
    const raw = data.content[0].text;

    let responses;
    try {
      const jsonMatch = raw.match(/\[[\s\S]*\]/);
      responses = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
    } catch {
      responses = [{ agent: 'night', text: raw }];
    }

    for (const r of responses) {
      const agentKey = r.agent.toLowerCase();
      if (!AGENTS[agentKey]) continue;

      const container = document.getElementById(`bubble-${agentKey}`);
      const textEl = container.querySelector('.bubble-text');
      textEl.textContent = '';
      container.classList.add('visible');
      await typeText(textEl, r.text, 18);
      await new Promise(res => setTimeout(res, 800));

      addToChatLog(agentKey, r.text);
      setTimeout(() => container.classList.remove('visible'), 3000);
    }
  } catch (e) {
    addToChatLog('night', `*static crackle* Something went wrong: ${e.message}`);
  }

  btn.disabled = false;
  btn.textContent = 'Ask';
}

// ===== INIT =====
window.addEventListener('load', async () => {
  await loadPortfolioData();
  renderHoldings();
  renderAggregate();
  drawHistoryChart();
  // Reload data.json every 5 min (prices update with each scan)
  setInterval(async () => {
    await loadPortfolioData();
    renderHoldings();
    renderAggregate();
    drawHistoryChart();
  }, 300000);
  setTimeout(runOpeningDebate, 1500);
  window.addEventListener('resize', drawHistoryChart);
});
</script>
