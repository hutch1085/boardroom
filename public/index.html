<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Boardroom — Crypto Scanner HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0e14;
  --surface: #141820;
  --surface2: #1a1f2e;
  --border: #2a3040;
  --text: #e2e8f0;
  --text-dim: #8892a4;
  --accent: #6366f1;
  --green: #22c55e;
  --red: #ef4444;
  --orange: #FF9F43;
  --blue: #3b82f6;
  --pink: #E91E63;
  --purple: #7C4DFF;
  --dawn: #FF9F43;
  --noon: #3b82f6;
  --close: #E91E63;
  --night: #7C4DFF;
}

html { font-size: 16px; }
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* === HEADER === */
.header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-title {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.header-title span { color: var(--accent); }
.header-meta {
  font-size: 0.75rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}

/* === HERO === */
.hero {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  max-height: 420px;
  overflow: hidden;
}
.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, transparent 40%, var(--bg) 100%);
}

/* === AGENT BUBBLES (overlaid on hero) === */
.agent-bubbles {
  position: absolute;
  bottom: 24px;
  left: 16px;
  right: 16px;
  display: flex;
  gap: 8px;
  z-index: 10;
  flex-wrap: wrap;
}
.speech-bubble {
  background: rgba(20, 24, 32, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 0.8rem;
  line-height: 1.4;
  max-width: 280px;
  border: 1px solid var(--border);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s, transform 0.4s;
  display: none;
}
.speech-bubble.visible {
  opacity: 1;
  transform: translateY(0);
  display: block;
}
.bubble-agent {
  font-weight: 600;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
}
.bubble-agent.dawn { color: var(--dawn); }
.bubble-agent.noon { color: var(--noon); }
.bubble-agent.close { color: var(--close); }
.bubble-agent.night { color: var(--purple); }

/* === BOARDS === */
.boards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 20px;
  max-width: 1200px;
  margin: 0 auto;
}
.board {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.board-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.board-title {
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.board-title.holdings { color: var(--green); }
.board-title.watchlist { color: var(--blue); }

.board-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 12px 18px;
  background: var(--surface2);
  font-size: 0.78rem;
  font-family: 'JetBrains Mono', monospace;
}
.sum-item { color: var(--text-dim); }
.sum-item strong { color: var(--text); }
.sum-up strong { color: var(--green) !important; }
.sum-down strong { color: var(--red) !important; }

.board-cards {
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 480px;
  overflow-y: auto;
}
.board-cards::-webkit-scrollbar { width: 4px; }
.board-cards::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Holdings card */
.board-card {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px 14px;
  border-left: 3px solid var(--border);
  transition: background 0.2s;
}
.board-card.profit { border-left-color: var(--green); }
.board-card.loss { border-left-color: var(--red); }
.card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.card-coin {
  font-weight: 700;
  font-size: 0.95rem;
  font-family: 'JetBrains Mono', monospace;
}
.card-pnl {
  font-weight: 700;
  font-size: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
}
.card-pnl.up { color: var(--green); }
.card-pnl.down { color: var(--red); }
.card-details {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 14px;
  font-size: 0.72rem;
  color: var(--text-dim);
  font-family: 'JetBrains Mono', monospace;
}

/* Watchlist card */
.watch-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--surface2);
  border-radius: 10px;
  padding: 10px 14px;
}
.watch-coin {
  font-weight: 700;
  font-size: 0.9rem;
  font-family: 'JetBrains Mono', monospace;
}
.exited-tag {
  display: inline-block;
  font-size: 0.6rem;
  background: var(--red);
  color: white;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 6px;
  font-weight: 600;
  text-transform: uppercase;
}
.watch-price {
  font-weight: 600;
  font-size: 0.85rem;
  font-family: 'JetBrains Mono', monospace;
  text-align: right;
}
.watch-changes {
  display: flex;
  gap: 10px;
  font-size: 0.7rem;
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
  justify-content: flex-end;
}
.change-up { color: var(--green); }
.change-down { color: var(--red); }

/* === CHAT === */
.chat-section {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px 20px;
}
.chat-container {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.chat-header {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  font-size: 0.85rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}
.chat-log {
  height: 320px;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.chat-log::-webkit-scrollbar { width: 4px; }
.chat-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.chat-msg {
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.avatar-sm {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  border: 2px solid;
  overflow: hidden;
}
.avatar-sm img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
.msg-body {
  background: var(--surface2);
  border-radius: 10px;
  padding: 10px 14px;
  font-size: 0.82rem;
  line-height: 1.5;
  border: 1px solid var(--border);
  max-width: 85%;
}
.msg-name {
  font-weight: 700;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.user-msg {
  justify-content: flex-end;
}
.user-msg .msg-body {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.chat-input-bar {
  display: flex;
  gap: 8px;
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
}
.chat-input-bar input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text);
  font-size: 0.85rem;
  font-family: 'Inter', sans-serif;
  outline: none;
  transition: border-color 0.2s;
}
.chat-input-bar input::placeholder { color: var(--text-dim); }
.chat-input-bar input:focus { border-color: var(--accent); }
.chat-input-bar button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-weight: 600;
  font-size: 0.85rem;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: opacity 0.2s;
}
.chat-input-bar button:hover { opacity: 0.85; }
.chat-input-bar button:disabled { opacity: 0.4; cursor: not-allowed; }

/* === TYPING CURSOR === */
.typing-cursor {
  display: inline-block;
  width: 2px;
  height: 1em;
  background: var(--accent);
  animation: blink 0.8s infinite;
  vertical-align: text-bottom;
  margin-left: 1px;
}
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

/* === FOOTER === */
.footer {
  text-align: center;
  padding: 20px;
  font-size: 0.7rem;
  color: var(--text-dim);
  border-top: 1px solid var(--border);
  margin-top: 12px;
}

/* === RESPONSIVE === */
@media (max-width: 768px) {
  .boards {
    grid-template-columns: 1fr;
    padding: 12px;
    gap: 12px;
  }
  .hero { max-height: 240px; }
  .agent-bubbles {
    bottom: 12px;
    left: 8px;
    right: 8px;
    gap: 6px;
  }
  .speech-bubble {
    max-width: 200px;
    font-size: 0.72rem;
    padding: 8px 10px;
  }
  .board-cards { max-height: 360px; }
  .chat-log { height: 260px; }
  .chat-section { padding: 0 12px 12px; }
  .header { padding: 12px 16px; }
  .header-title { font-size: 0.95rem; }
}

@media (max-width: 480px) {
  html { font-size: 14px; }
  .hero { max-height: 180px; }
  .speech-bubble { max-width: 160px; font-size: 0.68rem; }
  .agent-bubbles { flex-wrap: nowrap; overflow-x: auto; }
  .board-summary { gap: 8px; font-size: 0.72rem; }
  .card-details { gap: 4px 10px; font-size: 0.68rem; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-title"><span>THE</span> BOARDROOM</div>
  <div class="header-meta" id="lastUpdated">Loading...</div>
</header>

<!-- HERO with agent bubbles -->
<section class="hero">
  <img src="boardroom-hero.jpg" alt="Four AI trading agents around a boardroom table">
  <div class="hero-overlay"></div>
  <div class="agent-bubbles">
    <div class="speech-bubble" id="bubble-dawn">
      <div class="bubble-agent dawn">Dawn</div>
      <div class="bubble-text"></div>
    </div>
    <div class="speech-bubble" id="bubble-noon">
      <div class="bubble-agent noon">Noon</div>
      <div class="bubble-text"></div>
    </div>
    <div class="speech-bubble" id="bubble-close">
      <div class="bubble-agent close">Close</div>
      <div class="bubble-text"></div>
    </div>
    <div class="speech-bubble" id="bubble-night">
      <div class="bubble-agent night">Night</div>
      <div class="bubble-text"></div>
    </div>
  </div>
</section>

<!-- BOARDS -->
<section class="boards">
  <!-- Holdings Board -->
  <div class="board">
    <div class="board-header">
      <div class="board-title holdings">Holdings</div>
    </div>
    <div id="holdingsSummary"></div>
    <div class="board-cards" id="holdingsCards">
      <div style="padding:20px;text-align:center;color:var(--text-dim)">Loading prices...</div>
    </div>
  </div>

  <!-- Watchlist Board -->
  <div class="board">
    <div class="board-header">
      <div class="board-title watchlist">Watchlist</div>
    </div>
    <div class="board-cards" id="watchlistCards">
      <div style="padding:20px;text-align:center;color:var(--text-dim)">Loading prices...</div>
    </div>
  </div>
</section>

<!-- CHAT -->
<section class="chat-section">
  <div class="chat-container">
    <div class="chat-header">Agent Chat</div>
    <div class="chat-log" id="chatLog"></div>
    <div class="chat-input-bar">
      <input type="text" id="userInput" placeholder="Ask the agents about the portfolio..."
             onkeydown="if(event.key==='Enter')sendQuestion()">
      <button id="sendBtn" onclick="sendQuestion()">Ask</button>
    </div>
  </div>
</section>

<div class="footer" id="dataTimestamp">Boardroom Scanner HQ</div>

<script>
// ============================================================
// === DEFAULT DATA (overwritten by data.json) ===
// ============================================================
let HOLDINGS = [
  { sym:'BTC', id:'btc-bitcoin', qty:0.0003886, entry:63462.80, date:'Aug 16', cost:24.66 },
  { sym:'ETH', id:'eth-ethereum', qty:0.016746, entry:1913.05, date:'Aug 18', cost:32.05 },
  { sym:'SOL', id:'sol-solana', qty:0.96289, entry:92.80, date:'Aug 16', cost:89.36 },
  { sym:'UNI', id:'uni-uniswap', qty:3.2119, entry:3.32, date:'Aug 17', cost:10.75 },
  { sym:'LINK', id:'link-chainlink', qty:30.5616, entry:11.42, date:'Aug 29', cost:349.05 },
  { sym:'AAVE', id:'aave-new', qty:1.18158, entry:125.00, date:'Aug 31', cost:147.70 },
  { sym:'ZEC', id:'zec-zcash', qty:0.06224, entry:939.05, date:'Sep 3', cost:59.00 },
  { sym:'ADA', id:'ada-cardano', qty:468.38, entry:0.2116, date:'Sep 4', cost:100.00 },
  { sym:'LTC', id:'ltc-litecoin', qty:3.84515721, entry:52.01, date:'Sep 4', cost:200.00 },
  { sym:'DOT', id:'dot-polkadot', qty:154.152, entry:0.908, date:'Sep 4', cost:140.00 },
];
let WATCHLIST = [
  { sym:'XRP', id:'xrp-xrp' },
  { sym:'DOGE', id:'doge-dogecoin' },
  { sym:'SHIB', id:'shib-shiba-inu' },
  { sym:'AVAX', id:'avax-avalanche' },
  { sym:'PEPE', id:'pepe-pepe' },
  { sym:'XLM', id:'xlm-stellar', recentlyExited:true },
  { sym:'HYPE', id:'hype-hyperliquid', recentlyExited:true },
  { sym:'ETC', id:'etc-ethereum-classic' },
  { sym:'BCH', id:'bch-bitcoin-cash' },
  { sym:'ENS', id:'ens-ethereum-name-service' },
  { sym:'ARB', id:'arb-arbitrum', recentlyExited:true },
];
let CASH = 105;
let TENSIONS = '';
let OPENING = [];

// ============================================================
// === LOAD DATA.JSON ===
// ============================================================
async function loadPortfolioData() {
  try {
    const r = await fetch('data.json?t=' + Date.now());
    if (!r.ok) return;
    const data = await r.json();
    if (data.holdings) HOLDINGS = data.holdings;
    if (data.watchlist) WATCHLIST = data.watchlist;
    if (data.cash != null) CASH = data.cash;
    if (data.tensions) TENSIONS = data.tensions;
    if (data.opening && data.opening.length) OPENING = data.opening;
    if (data.lastUpdated) {
      const d = new Date(data.lastUpdated);
      const el = document.getElementById('dataTimestamp');
      if (el) el.textContent = 'Last scan: ' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString();
    }
  } catch(e) {
    console.warn('Could not load data.json', e);
  }
}

// ============================================================
// === STATE ===
// ============================================================
let priceCache = {};

const AGENTS = {
  dawn:  { name:'Dawn',  color:'#FF9F43', bg:'rgba(255,159,67,0.15)', icon:'☀️' },
  noon:  { name:'Noon',  color:'#3b82f6', bg:'rgba(59,130,246,0.15)', icon:'📊' },
  close: { name:'Close', color:'#E91E63', bg:'rgba(233,30,99,0.15)',  icon:'🛡️' },
  night: { name:'Night', color:'#7C4DFF', bg:'rgba(124,77,255,0.15)', icon:'🦉' },
};

// ============================================================
// === COINPAPRIKA PRICE FETCHING ===
// ============================================================
async function fetchAllPrices() {
  const allIds = [...HOLDINGS.map(h => h.id), ...WATCHLIST.map(w => w.id)];
  const unique = [...new Set(allIds)];
  const results = await Promise.allSettled(
    unique.map(id =>
      fetch(`https://api.coinpaprika.com/v1/tickers/${id}`)
        .then(r => r.ok ? r.json() : Promise.reject(r.status))
    )
  );
  results.forEach((r, i) => {
    if (r.status === 'fulfilled') priceCache[unique[i]] = r.value;
  });
  renderHoldings();
  renderWatchlist();
  updateTimestamp();
}

function updateTimestamp() {
  const el = document.getElementById('lastUpdated');
  const now = new Date();
  el.textContent = now.toLocaleTimeString();
}

function fmt(n, decimals = 2) {
  if (n == null || isNaN(n)) return '—';
  if (Math.abs(n) >= 1) return n.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  if (Math.abs(n) < 0.01) return n.toFixed(6);
  return n.toFixed(4);
}

function fmtUSD(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + fmt(n);
}

// ============================================================
// === RENDER HOLDINGS ===
// ============================================================
function renderHoldings() {
  const container = document.getElementById('holdingsCards');
  const summaryEl = document.getElementById('holdingsSummary');
  let totalValue = 0, totalCost = 0;
  let html = '';
  const today = new Date();

  for (const h of HOLDINGS) {
    const ticker = priceCache[h.id];
    const currentPrice = ticker ? ticker.quotes.USD.price : null;
    const currentValue = currentPrice != null ? h.qty * currentPrice : null;
    const pnlPct = currentPrice != null ? ((currentPrice - h.entry) / h.entry) * 100 : null;
    const pnlAbs = currentValue != null ? currentValue - h.cost : null;
    const entryDate = new Date(`${h.date}, 2025`);
    const daysHeld = Math.max(1, Math.round((today - entryDate) / 86400000));
    if (currentValue != null) totalValue += currentValue;
    totalCost += h.cost;
    const isUp = pnlPct != null && pnlPct >= 0;
    const pnlClass = isUp ? 'up' : 'down';
    const cardClass = isUp ? 'profit' : 'loss';

    html += `
      <div class="board-card ${pnlPct != null ? cardClass : ''}">
        <div class="card-top">
          <div class="card-coin">${h.sym}</div>
          <div class="card-pnl ${pnlClass}">${pnlPct != null ? (isUp ? '+' : '') + pnlPct.toFixed(1) + '%' : '...'}</div>
        </div>
        <div class="card-details">
          <span>Qty: ${fmt(h.qty, 4)}</span>
          <span>Entry: ${fmtUSD(h.entry)}</span>
          <span>Now: ${currentPrice != null ? fmtUSD(currentPrice) : '...'}</span>
          <span>Cost: ${fmtUSD(h.cost)}</span>
          <span>Val: ${currentValue != null ? fmtUSD(currentValue) : '...'}</span>
          <span>P&L: ${pnlAbs != null ? (pnlAbs >= 0 ? '+' : '') + fmtUSD(pnlAbs) : '...'}</span>
          <span>${daysHeld}d</span>
        </div>
      </div>`;
  }
  container.innerHTML = html;

  const totalPnl = totalValue - totalCost;
  const totalPnlPct = totalCost > 0 ? (totalPnl / totalCost) * 100 : 0;
  const isUp = totalPnl >= 0;
  const cls = isUp ? 'sum-up' : 'sum-down';
  summaryEl.innerHTML = `
    <div class="board-summary">
      <span class="sum-item">Portfolio: <strong>${fmtUSD(totalValue)}</strong></span>
      <span class="sum-item">Cost: <strong>${fmtUSD(totalCost)}</strong></span>
      <span class="sum-item ${cls}">P&L: <strong>${(isUp ? '+' : '') + fmtUSD(totalPnl)} (${(isUp ? '+' : '') + totalPnlPct.toFixed(1)}%)</strong></span>
      <span class="sum-item" style="color:var(--blue);">Cash: <strong>~$${CASH}</strong></span>
    </div>`;
}

// ============================================================
// === RENDER WATCHLIST ===
// ============================================================
function renderWatchlist() {
  const container = document.getElementById('watchlistCards');
  let html = '';
  for (const w of WATCHLIST) {
    const ticker = priceCache[w.id];
    const price = ticker ? ticker.quotes.USD.price : null;
    const chg24 = ticker ? ticker.quotes.USD.percent_change_24h : null;
    const chg7d = ticker ? ticker.quotes.USD.percent_change_7d : null;
    const exitedTag = w.recentlyExited ? '<span class="exited-tag">Exited</span>' : '';
    html += `
      <div class="watch-card">
        <div>
          <span class="watch-coin">${w.sym}</span>${exitedTag}
        </div>
        <div style="text-align:right">
          <div class="watch-price">${price != null ? fmtUSD(price) : '...'}</div>
          <div class="watch-changes">
            <span class="${chg24 != null && chg24 >= 0 ? 'change-up' : 'change-down'}">24h: ${chg24 != null ? (chg24 >= 0 ? '+' : '') + chg24.toFixed(1) + '%' : '...'}</span>
            <span class="${chg7d != null && chg7d >= 0 ? 'change-up' : 'change-down'}">7d: ${chg7d != null ? (chg7d >= 0 ? '+' : '') + chg7d.toFixed(1) + '%' : '...'}</span>
          </div>
        </div>
      </div>`;
  }
  container.innerHTML = html;
}

// ============================================================
// === SYSTEM PROMPT ===
// ============================================================
function buildSystemPrompt() {
  let holdingsText = HOLDINGS.map(h => {
    const t = priceCache[h.id];
    const cur = t ? '$' + t.quotes.USD.price.toFixed(2) : '?';
    return `- ${h.sym} ${h.qty} @ $${h.entry} entry (now ${cur}), cost $${h.cost}`;
  }).join('\n');

  return `You are playing 4 distinct cartoon characters who are crypto trading scanner agents sitting around a boardroom table. They are debating James's portfolio and trading strategy.

THE 4 AGENTS:
1. "Dawn" (6AM HST scan) — The early bird. Enthusiastic, optimistic, always caffeinated. Uses sunrise/morning metaphors. Sees opportunity everywhere. Speaks with energy and exclamation marks.
2. "Noon" (12PM HST scan) — The analyst. Sharp, data-driven, references charts and indicators. Professional but not boring. Uses precise numbers. The most measured voice.
3. "Close" (4PM HST scan) — The risk manager. Cautious, protective of capital. Sunset/end-of-day metaphors. Worries about drawdowns and concentration risk. Maternal/paternal about the portfolio.
4. "Night" (8PM HST scan) — The contrarian owl. Nocturnal, sees what others miss. Loves going against consensus. Cryptic one-liners. Dark humor. Questions everything.

JAMES'S CURRENT PORTFOLIO (cash ~$${CASH}):
${holdingsText}

KEY TENSIONS THE AGENTS SHOULD REFERENCE:
${TENSIONS || '- Check data.json for current tensions'}

RESPONSE FORMAT:
You MUST respond in valid JSON. Pick 1-3 agents who would most naturally respond to the question. Format:
[
  {"agent": "dawn", "text": "..."},
  {"agent": "noon", "text": "..."}
]

Each agent's response should be 1-3 sentences, in their distinct voice. They can agree, disagree, or riff off each other. Keep responses punchy and character-driven. Reference specific positions and numbers when relevant.`;
}

// ===== TYPING ANIMATION =====
function typeText(element, text, speed = 25) {
  return new Promise(resolve => {
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'typing-cursor';
    element.textContent = '';
    element.appendChild(cursor);
    function tick() {
      if (i < text.length) {
        cursor.before(document.createTextNode(text[i]));
        i++;
        setTimeout(tick, speed + Math.random() * 15);
      } else {
        cursor.remove();
        resolve();
      }
    }
    tick();
  });
}

// ===== OPENING DEBATE =====
async function runOpeningDebate() {
  if (!OPENING.length) return;
  for (const line of OPENING) {
    const container = document.getElementById(`bubble-${line.agent}`);
    if (!container) continue;
    const textEl = container.querySelector('.bubble-text');
    container.classList.add('visible');
    await typeText(textEl, line.text, 20);
    await new Promise(r => setTimeout(r, 1200));
  }
  await new Promise(r => setTimeout(r, 3000));
  for (const line of OPENING) {
    const el = document.getElementById(`bubble-${line.agent}`);
    if (el) el.classList.remove('visible');
    addToChatLog(line.agent, line.text);
  }
}

// ===== CHAT LOG =====
function addToChatLog(agentKey, text) {
  const log = document.getElementById('chatLog');
  const a = AGENTS[agentKey];
  if (!a) return;
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `
    <div class="avatar-sm" style="background:${a.bg};border-color:${a.color}">${a.icon}</div>
    <div class="msg-body" style="border-color:${a.color}30">
      <div class="msg-name" style="color:${a.color}">${a.name}</div>
      ${text}
    </div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function addUserMsg(text) {
  const log = document.getElementById('chatLog');
  const div = document.createElement('div');
  div.className = 'chat-msg user-msg';
  div.innerHTML = `<div class="msg-body"><div class="msg-name" style="color:rgba(255,255,255,0.7)">James</div>${text}</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// ===== SEND QUESTION =====
async function sendQuestion() {
  const input = document.getElementById('userInput');
  const btn = document.getElementById('sendBtn');
  const q = input.value.trim();
  if (!q) return;

  input.value = '';
  btn.disabled = true;
  btn.textContent = '...';
  addUserMsg(q);

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: buildSystemPrompt(),
        messages: [{ role: 'user', content: q }],
      }),
    });

    if (!resp.ok) {
      const err = await resp.text();
      throw new Error(`API ${resp.status}: ${err.slice(0, 200)}`);
    }

    const data = await resp.json();
    const raw = data.content[0].text;

    let responses;
    try {
      const jsonMatch = raw.match(/\[[\s\S]*\]/);
      responses = JSON.parse(jsonMatch ? jsonMatch[0] : raw);
    } catch {
      responses = [{ agent: 'night', text: raw }];
    }

    for (const r of responses) {
      const agentKey = r.agent.toLowerCase();
      if (!AGENTS[agentKey]) continue;

      const container = document.getElementById(`bubble-${agentKey}`);
      const textEl = container.querySelector('.bubble-text');
      textEl.textContent = '';
      container.classList.add('visible');
      await typeText(textEl, r.text, 18);
      await new Promise(res => setTimeout(res, 800));

      addToChatLog(agentKey, r.text);
      setTimeout(() => container.classList.remove('visible'), 3000);
    }
  } catch (e) {
    addToChatLog('night', `*static crackle* Something went wrong: ${e.message}`);
  }

  btn.disabled = false;
  btn.textContent = 'Ask';
}

// ===== INIT =====
window.addEventListener('load', async () => {
  await loadPortfolioData();
  fetchAllPrices();
  setInterval(fetchAllPrices, 60000);
  setTimeout(runOpeningDebate, 1500);
});
